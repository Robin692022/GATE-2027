    .glass-panel {
      background: rgba(18, 18, 23, 0.75);

    }

    .glow-pulse {
      animation: pulseGlow 3s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(99, 102, 241, 0.2); }
      50% { box-shadow: 0 0 30px rgba(99, 102, 241, 0.6); }
    }

    /* SVG Heatmap Transitions */
    .heatmap-cell {
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .heatmap-cell:hover {
      transform: scale(1.25);

                    <option>4 – 7 Days (Compress Material Science to 10h crash YouTube)</option>
                    <option>2+ Weeks (Strategic Roadmap Re-balancing)</option>
                  </select>
                </div>

                <button
                  onClick={() => {
                    alert("Roadmap successfully re-balanced! Lower ROI topics compressed; High ROI core protected.");
                    setIsRecoveryOpen(false);
                  }}
                  className="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-zinc-950 font-semibold text-xs transition-colors"
                >
                  Execute Schedule Recovery
                </button>
              </div>
            </div>
          )}

          {/* --- ADD MOCK RESULT MODAL --- */}
          {isAddMockOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="glass-panel w-full max-w-md rounded-2xl p-6 space-y-4 border border-indigo-500/40">
                <div className="flex justify-between items-center pb-2 border-b border-zinc-800">
                  <h3 className="font-semibold text-sm text-zinc-100">Log Mock Test Outcome</h3>
                  <button onClick={() => setIsAddMockOpen(false)} className="text-zinc-500 text-xs">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  handleAddMock({
                    id: Date.now(),
                    name: form.name.value,
                    date: form.date.value,
                    score: Number(form.score.value),
                    total: Number(form.total.value),
                    accuracy: Number(form.accuracy.value),
                    negative: Number(form.negative.value),
                    time: form.time.value,
                    weak: form.weak.value
                  });
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-zinc-400">Test Name</label>
                    <input name="name" required placeholder="e.g. SOM Subject Test 2" className="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-zinc-200" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-zinc-400">Date</label>
                      <input name="date" type="date" required defaultValue={new Date().toISOString().split('T')[0]} className="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-zinc-200" />
                    </div>
                    <div>
                      <label className="block text-zinc-400">Time Taken</label>
                      <input name="time" placeholder="e.g. 45 mins" required className="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-zinc-200" />
                    </div>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="block text-zinc-400">Score</label>
                      <input name="score" type="number" step="0.1" required className="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-zinc-200" />
                    </div>
                    <div>
                      <label className="block text-zinc-400">Total</label>
                      <input name="total" type="number" defaultValue="50" required className="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-zinc-200" />
                    </div>
                    <div>
                      <label className="block text-zinc-400">Accuracy %</label>
                      <input name="accuracy" type="number" required className="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-zinc-200" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-zinc-400">Negative Marks</label>
                    <input name="negative" type="number" step="0.01" defaultValue="1.33" required className="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-zinc-200" />
                  </div>
                  <div>
                    <label className="block text-zinc-400">Weak Topics Identified</label>
                    <input name="weak" placeholder="e.g. Macaulay method calculation" className="w-full bg-zinc-900 border border-zinc-800 rounded p-2 text-zinc-200" />
                  </div>

                  <button type="submit" className="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold transition-colors mt-2">
                    Save Test Record
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render App Component to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
